lab:
  description: Network-as-Code lab - Day-0 bootstrap (mgmt reachability only)
  notes: |-
    CML VM network adapter = VMware NAT (VMnet8, 192.168.20.0/24); ext-conn-0 = System Bridge.
    R-Edge Gi0/0 = 192.168.20.10, default via VMware NAT gateway 192.168.20.2.
    Windows route: route add 10.255.0.0 mask 255.255.0.0 192.168.20.10 -p
    P2P links use 172.16.0.0/30s.
    Mgmt: loopbacks 10.255.0.1-5, SW-ACC 10.255.99.10. user cisco / cisco
  title: netauto-lab
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
