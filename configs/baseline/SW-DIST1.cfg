!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname SW-DIST1
!
boot-start-marker
boot-end-marker
!
!
!
username cisco privilege 15 secret 5 $1$UujO$MW6UvKE4OI94s1m4KYZyz1
aaa new-model
!
!
aaa authentication login default local
aaa authorization exec default local
!
!
!
!
!
!
aaa session-id common
!
!
!
!
!
vtp mode transparent
!
!
!
no ip domain-lookup
ip domain-name lab.local
ip cef
no ipv6 cef
!
!
archive
 path flash0:archive
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 10,99 priority 4096
spanning-tree vlan 20 priority 8192
!
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 99
 name MGMT
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 ip ospf 1 area 0
!
interface Port-channel1
 switchport trunk allowed vlan 10,20,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface GigabitEthernet0/0
 description to-R-CORE
 no switchport
 ip address 172.16.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 negotiation auto
!
interface GigabitEthernet0/1
 description to-SW-ACC
 switchport trunk allowed vlan 10,20,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
!
interface GigabitEthernet0/2
 description Po1-to-SW-DIST2
 switchport trunk allowed vlan 10,20,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
 channel-group 1 mode active
!
interface GigabitEthernet0/3
 description Po1-to-SW-DIST2
 switchport trunk allowed vlan 10,20,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
 channel-group 1 mode active
!
interface Vlan10
 ip address 10.10.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 preempt
 ip ospf 1 area 0
!
interface Vlan20
 ip address 10.10.20.2 255.255.255.0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 90
 standby 20 preempt
 ip ospf 1 area 0
!
interface Vlan99
 description MGMT
 ip address 10.255.99.2 255.255.255.0
 standby version 2
 standby 99 ip 10.255.99.1
 standby 99 priority 110
 standby 99 preempt
 ip ospf 1 area 0
!
router ospf 1
 router-id 10.255.0.4
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan99
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip scp server enable
!
!
!
!
!
!
!
!
control-plane
!
