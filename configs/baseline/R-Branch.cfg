!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-Branch
!
boot-start-marker
boot-end-marker
!
!
!
aaa new-model
!
!
aaa authentication login default local
aaa authorization exec default local
!
!
!
!
!
aaa session-id common
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
archive
 path flash0:archive
username cisco privilege 15 secret 9 $9$80BNXtE43n8g.7$Zo4p8drUavuYALkIhyGp56Hmr.mk4ZvUILQLHPtipdI
!
redundancy
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description to-R-Edge
 ip address 172.16.0.2 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 description to-R-CORE
 ip address 172.16.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 10.255.0.2
 default-information originate
!
router bgp 65001
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 network 10.10.0.0 mask 255.255.0.0
 neighbor 172.16.0.1 remote-as 65000
 neighbor 172.16.0.1 description R-Edge
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 172.16.0.1
ip route 10.10.0.0 255.255.0.0 Null0
ip ssh version 2
ip scp server enable
!
ipv6 ioam timestamp
!
!
!
!
!
control-plane
!
banner exec ^C
